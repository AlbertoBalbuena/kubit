[package]
name = "wasm-truck"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
backend-truck = { path = "../../backends/truck" }
harness = { path = "../../harness", default-features = false }
wasm-bindgen = "=0.2.129"
serde_json = "1"
# truck pulls getrandom 0.2 (rayon/ahash); the js feature wires it to Web Crypto in wasm.
getrandom = { version = "0.2", features = ["js"] }

[workspace]
