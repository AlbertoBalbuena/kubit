[package]
name = "wasm-arris"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Own workspace: excluded from the spike workspace (see wasm/README.md).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
backend-arris = { path = "../../backends/arris" }
harness = { path = "../../harness", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
