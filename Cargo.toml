[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# The kernel spike is its own workspace (docs/adr/0002-kernel-backend.md).
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/AlbertoBalbuena/kubit"
publish = false

[workspace.dependencies]
kubit-math = { path = "crates/kubit-math" }
kubit-kernel-api = { path = "crates/kubit-kernel-api" }
kubit-kernel-arris = { path = "crates/kubit-kernel-arris" }
kubit-mesh = { path = "crates/kubit-mesh" }
kubit-render = { path = "crates/kubit-render" }
kubit-doc = { path = "crates/kubit-doc" }
kubit-io = { path = "crates/kubit-io" }
kubit-engine = { path = "crates/kubit-engine" }
kubit-mcp = { path = "crates/kubit-mcp" }
kubit-ui = { path = "crates/kubit-ui" }

# Third-party (versions and licenses checked on crates.io, 2026-10-26).
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
indexmap = { version = "2.14.2", features = ["serde"] }
proptest = "1.12.0"
schemars = "1.2.3"
clap = { version = "4.6.7", features = ["derive"] }
# Stored entries only: .kubit v1 is small and must be byte-for-byte deterministic.
zip = { version = "=9.0.5", default-features = false }
# MCP SDK (Apache-2.0). 3.5.1 is the newest 3.x at least a week old (2026-10-26);
# 3.6.0 landed 2026-10-20. Server side only: clients are dev-dependencies.
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
# B-rep kernel (MIT OR Apache-2.0), provisional ADR-0002 pick. Only kubit-kernel-arris uses it.
# Exact pin: kernel upgrades are deliberate (results and ids may change).
arris = { version = "=0.9.1", default-features = false }
# Async runtime for the MCP front end only (kubit-mcp, kubit-cli).
tokio = { version = "1.54.1", default-features = false }
# Desktop UI (L5 only). egui_dock 0.21.1 (newest) requires egui ^0.36, so the egui
# family stays on 0.36.2; egui-wgpu 0.36 uses wgpu ^30 like kubit-render. MIT OR Apache-2.0
# (egui_dock: MIT). These need Rust 1.95, set as rust-version on kubit-ui and kubit.
egui = "0.36.2"
eframe = "0.36.2"
egui_dock = "0.21.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Production code never panics (CLAUDE.md rule 4). Tests may: see clippy.toml.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
indexing_slicing = "warn"

[profile.release]
debug = "line-tables-only"
