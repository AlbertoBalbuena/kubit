[package]
name = "kubit-cli"
description = "Kubit headless CLI: run, export, mcp, snapshot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "kubit-cli"
path = "src/main.rs"

[dependencies]
kubit-engine.workspace = true
kubit-doc.workspace = true
# Phase 0 placeholder backend until ADR-0002 picks the real one (see src/backend.rs).
kubit-kernel-api = { workspace = true, features = ["testing"] }
kubit-mcp.workspace = true
kubit-render.workspace = true
tokio = { workspace = true, features = ["rt"] }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
kubit-io.workspace = true

[lints]
workspace = true
