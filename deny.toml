# cargo-deny 0.20 configuration (CLAUDE.md rule 9, docs/adr/0001).
# Allowed: Apache-2.0, MIT, BSD-2/3, ISC, Zlib, Unicode-3.0. MPL-2.0 only by explicit exception.
# Denied: GPL, LGPL, AGPL (anything not allowed is rejected).

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]
all-features = true

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
# MPL-2.0 needs a review: add a crate-specific entry here, never a global allow.
# UI-layer only (egui/eframe). BSL-1.0 is a permissive OSI licence (clipboard on Windows);
# OFL-1.1 and Ubuntu-font-1.0 cover the bundled default fonts. None reach crates below L5.
exceptions = [
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
    { crate = "epaint_default_fonts", allow = ["OFL-1.1", "Ubuntu-font-1.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are path dependencies and may use wildcard versions.
allow-wildcard-paths = true
deny = [
    # evalexpr >= 13 is AGPL.
    { crate = "evalexpr", reason = "AGPL-3.0 since 13" },
    # SolveSpace bindings are GPL.
    { crate = "slvs", reason = "GPL-3.0" },
    { crate = "slvs-sys", reason = "GPL-3.0" },
    # OCCT is LGPL and must never be linked into the core.
    { crate = "opencascade", reason = "LGPL-2.1 (OCCT)" },
    { crate = "opencascade-sys", reason = "LGPL-2.1 (OCCT)" },
]

[advisories]
version = 2
yanked = "deny"
# "Unmaintained" notices (no known vulnerability) pulled in transitively by egui/eframe/winit,
# UI layer only. Review when egui updates.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste, via egui_dock (proc-macro, no runtime code)" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via winit window decorations on Linux" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant, via accesskit/zbus on Linux" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names, via accesskit/zbus on Linux" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive, via accesskit/zbus on Linux" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allowed in case the kernel decision (ADR-0002) picks solidcore.
allow-git = ["https://github.com/tangency-labs/solidcore"]
