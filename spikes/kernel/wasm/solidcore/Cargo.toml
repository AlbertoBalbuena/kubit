[package]
name = "wasm-solidcore"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

# Own workspace: kept apart from the spike workspace (own lockfile and target dir).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
backend-solidcore = { path = "../../backends/solidcore" }
harness = { path = "../../harness", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = "s"
lto = true
debug = false
